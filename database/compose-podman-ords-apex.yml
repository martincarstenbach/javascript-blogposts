# THIS IS NOT A PRODUCTION SETUP - LAB USE ONLY!
services:
    oracle:

        image: docker.io/gvenzl/oracle-free:23.26.3
        ports:
            - 1521:1521
        environment:
            ORACLE_PASSWORD: ${ORACLE_PASSWORD:?Please provide a password for the Oracle DBA accounts}
            APP_USER: demouser
            APP_USER_PASSWORD: ${APP_USER_PASSWORD:?Please provide a password for the application user}
        volumes:
            - oradata-vol:/opt/oracle/oradata
            - ./initialisation:/container-entrypoint-initdb.d:Z
        networks:
            - backend
        healthcheck:
            test: ["CMD", "/opt/oracle/healthcheck.sh"]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 5s
            start_interval: 5s

    ords:
        depends_on:
            oracle:
                condition: service_healthy
        image: container-registry.oracle.com/database/ords:26.3.0
        environment:
            DBHOST: oracle
            DBPORT: 1521
            DBSERVICENAME: freepdb1
            ORACLE_PWD: ${ORACLE_PASSWORD:?Please provide a password for the Oracle DBA accounts}
            ORACLE_USER_PWD: ${ORACLE_USER_PWD:?Please provide a password for the ORDS administrative and runtime accounts}
            DEBUG: FALSE
        networks:
            - backend
        ports:
            - 8080:8080
            - 8443:8443
            - 27017:27017
        volumes:
            - ords-config-vol:/etc/ords/config
            # use this volume mount for the initial APEX installation. There is no need to remove the mount after APEX is installed
            # - ./apex:/opt/oracle/apex:Z
        healthcheck:
            test: curl --noproxy "localhost" -f -k http://localhost:8080/ords/ || exit 1
            interval: 30s
            timeout: 10s
            retries: 5

volumes:
    oradata-vol:
    ords-config-vol:

networks:
    backend: